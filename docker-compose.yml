services:
  db:
    image: gvenzl/oracle-free:latest
    container_name: oracle-free
    environment:
      ORACLE_PASSWORD: "NewStrongPass123"
    ports:
      - "1521:1521"
    volumes:
      - db_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s system/NewStrongPass123@localhost/FREE"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    networks:
      - app-network

  app:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "1521"
      DB_SERVICE: "FREE"
      DB_USER: "system"
      DB_PASSWORD: "NewStrongPass123"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
